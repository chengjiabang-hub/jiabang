name: Update Material Data

on:
  schedule:
    - cron: '0 2 1 * *'   # 每月1日
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: 設定 Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: 安裝套件
        run: pip install pandas openpyxl

      - name: 執行程式
        run: python main.py

      - name: Commit更新
        run: |
          git config --global user.name "bot"
          git config --global user.email "bot@github.com"
          git add history.xlsx
          git commit -m "auto update material data" || echo "no changes"
          git push
